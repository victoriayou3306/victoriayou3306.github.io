  <!-- Lightbox (not currently used on this page, kept for consistency) -->
  <div class="lightbox" id="lightbox" onclick="if(event.target===this)lbClose()">
    <button class="lb-close" onclick="lbClose()">×</button>
    <img id="lbImg" src="" alt="" />
    <div class="lb-caption" id="lbCaption"></div>
  </div>

  <script src="garage.js"></script>
  <script src="projects-utils.js"></script>
  <script>
    function lb(imgEl) {
      document.getElementById('lbImg').src = imgEl.src;
      document.getElementById('lbCaption').textContent = imgEl.alt || '';
      document.getElementById('lightbox').classList.add('open');
    }
    function lbClose() { document.getElementById('lightbox').classList.remove('open'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') lbClose(); });

    const garageGrid = document.getElementById('garageCards');
    GARAGE.forEach(v => garageGrid.appendChild(buildGarageCard(v)));

    document.getElementById('navCraneCount').textContent = CRANE_COUNT;
  </script>
